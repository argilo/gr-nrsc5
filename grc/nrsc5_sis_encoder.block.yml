inputs:
-   domain: message
    id: clock
    optional: false
-   domain: message
    id: ready
    optional: true
-   domain: message
    id: command
    optional: true

outputs:
-   domain: message
    id: aas
    optional: true
-   label: pids
    domain: stream
    dtype: byte
    vlen: 80
asserts:
-   ${ len(slogan) <= 95 }
-   ${ len(message) <= 190 }
-   ${ 1 <= num_programs <= 8 }
-   ${ -90 <= latitude <= 90 }
-   ${ -180 <= longitude <= 180 }
-   ${ len(country_code) == 2 }
-   ${ len(exciter_manufacturer_id) == 2 }
-   ${ len(importer_manufacturer_id) == 2 }

templates:
    imports: import nrsc5
    make: |
        nrsc5.sis_encoder(
            mode=${mode},
            short_name=${short_name},
            slogan=${slogan},
            message=${message},
            program_names=[${program_name0}${ ', '+program_name1 if int(num_programs) >= 2 else '' }${ ', '+program_name2 if int(num_programs) >= 3 else '' }${ ', '+program_name3 if int(num_programs) >= 4 else '' }${ ', '+program_name4 if int(num_programs) >= 5 else '' }${ ', '+program_name5 if int(num_programs) >= 6 else '' }${ ', '+program_name6 if int(num_programs) >= 7 else '' }${ ', '+program_name7 if int(num_programs) >= 8 else '' }],
            program_types=[${program_type0}${ ', '+program_type1 if int(num_programs) >= 2 else '' }${ ', '+program_type2 if int(num_programs) >= 3 else '' }${ ', '+program_type3 if int(num_programs) >= 4 else '' }${ ', '+program_type4 if int(num_programs) >= 5 else '' }${ ', '+program_type5 if int(num_programs) >= 6 else '' }${ ', '+program_type6 if int(num_programs) >= 7 else '' }${ ', '+program_type7 if int(num_programs) >= 8 else '' }],
            data_types=[${'nrsc5.service_data_type.EMERGENCY, ' if emergency_alerts == 'True' else ''}],
            data_mime_types=[${'0x444, ' if emergency_alerts == 'True' else ''}],
            latitude=${latitude},
            longitude=${longitude},
            altitude=${altitude},
            country_code=${country_code},
            fcc_facility_id=${fcc_facility_id},
            data_channels=[${ 'nrsc5.data_channel_config('+dc0_port+', '+dc0_lot_id+', int('+dc0_sdt+'), int('+dc0_mime+'), '+dc0_name+'), ' if int(num_data_channels) >= 1 else '' }${ 'nrsc5.data_channel_config('+dc1_port+', '+dc1_lot_id+', int('+dc1_sdt+'), int('+dc1_mime+'), '+dc1_name+'), ' if int(num_data_channels) >= 2 else '' }${ 'nrsc5.data_channel_config('+dc2_port+', '+dc2_lot_id+', int('+dc2_sdt+'), int('+dc2_mime+'), '+dc2_name+'), ' if int(num_data_channels) >= 3 else '' }${ 'nrsc5.data_channel_config('+dc3_port+', '+dc3_lot_id+', int('+dc3_sdt+'), int('+dc3_mime+'), '+dc3_name+'), ' if int(num_data_channels) >= 4 else '' }${ 'nrsc5.data_channel_config('+dc4_port+', '+dc4_lot_id+', int('+dc4_sdt+'), int('+dc4_mime+'), '+dc4_name+'), ' if int(num_data_channels) >= 5 else '' }${ 'nrsc5.data_channel_config('+dc5_port+', '+dc5_lot_id+', int('+dc5_sdt+'), int('+dc5_mime+'), '+dc5_name+'), ' if int(num_data_channels) >= 6 else '' }${ 'nrsc5.data_channel_config('+dc6_port+', '+dc6_lot_id+', int('+dc6_sdt+'), int('+dc6_mime+'), '+dc6_name+'), ' if int(num_data_channels) >= 7 else '' }${ 'nrsc5.data_channel_config('+dc7_port+', '+dc7_lot_id+', int('+dc7_sdt+'), int('+dc7_mime+'), '+dc7_name+'), ' if int(num_data_channels) >= 8 else '' }],
            exciter_manufacturer_id=${exciter_manufacturer_id},
            importer_manufacturer_id=${importer_manufacturer_id},
            exciter_core_version=[int(x) for x in ${exciter_core_ver}.split('.')],
            exciter_mfr_version=[int(x) for x in ${exciter_mfr_ver}.split('.')],
            importer_core_version=[int(x) for x in ${importer_core_ver}.split('.')],
            importer_mfr_version=[int(x) for x in ${importer_mfr_ver}.split('.')],
            importer_configuration_number=${importer_config_number})

documentation: |-
    SIS (Station Information Service) and SIG (Station Information Guide) encoder.

    Data Channels: Configure data-only channels for transmitting LOT files
    independent of audio subchannels. Each data channel is advertised in SIG
    with its port, LOT ID, Service Data Type, and MIME Type Hash so decoders
    can properly reassemble the LOT objects.

    SIS Parameters (runtime via TCP command port):
      set_param|<index>|<value>
        Index 0:  Leap Second Offset (pending|current or 0xPPCC)
        Index 1:  Leap Second ALFN LSB
        Index 2:  Leap Second ALFN MSB
        Index 3:  Local Time (utc_offset_minutes[|dst_sched|dst_local|dst_regional])
        Index 4:  Exciter Manufacturer ID (2 chars)
        Index 5:  Exciter Core Version (L1.L2.L3)
        Index 6:  Exciter Mfr Version (L1.L2.L3)
        Index 7:  Exciter V4+Status (core4.mfr4.core_status.mfr_status)
        Index 8:  Importer Manufacturer ID (2 chars)
        Index 9:  Importer Core Version (L1.L2.L3)
        Index 10: Importer Mfr Version (L1.L2.L3)
        Index 11: Importer V4+Status (core4.mfr4.core_status.mfr_status)
        Index 12: Importer Configuration Number (0-65535)

file_format: 1
